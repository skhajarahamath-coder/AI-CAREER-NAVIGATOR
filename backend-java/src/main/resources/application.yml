server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-career-navigator

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/career_navigator_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# AI Career Recommendation Weighted Algorithm Configuration
career:
  matching:
    weights:
      interest-match: 0.30        # 30% weight
      education-compat: 0.20      # 20% weight
      skill-match: 0.20           # 20% weight
      goal-match: 0.10            # 10% weight
      academic-subjects: 0.10     # 10% weight
      projects-certs: 0.10        # 10% weight
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-3.8-flash
